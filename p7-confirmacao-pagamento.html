<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">

    <title>confirmaçãO de pagamento</title>
</head>
<body>
    <header>  <!--cabeçalho (barra de menu)-->

        <div id="logo">  <!--logotipo e slogan-->

                <h1 id="smarfilas"><span id="smart">Smart</span> <span id="filas">Filas</span></h1>

       <img scr="#" id="seta" alt="seta">

             <!--menu inicio-->
            <div id="inicio">
                <img scr="#" id="imgInicio" alt="#">
                <a href="Inicio" id="inicio" target="_self">Inicio</a>
            </div>
       
             <!--menu solicitar senha-->
            <div id="divSolicitacaoDeSenha">

             <!--menu notificações-->

         <!--escolher idioma-->

        <div id="direita">
            <p id="confirmado">Consulta Geral</p>
            <p id="confirmado">3,00 MTs</p>
            <p id="confirmado">M-pesa</p>
            <p id="pago">84 123 456 78</p>
        </div>
    </section>

    <button>Emitir Senha</button>
