<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centro de Dúvidas e Feedbacks</title>
</head>
<body>
<header>  <!--cabeçalho (barra de menu)-->

        <div id="logo">  <!--logotipo e slogan-->
            <img src="#" alt="imgLogo">
            <div id="logoNome">
                <h1 id="smarfilas"><span id="smart">Smart</span> <span id="filas">Filas</span></h1>
                <P id="slogan">Menos espera, Mais informação.</P>
            </div>
        </div>
       <img scr="#" id="seta" alt="seta">

        <div class="menu">   <!--menu container-->

             <!--menu inicio-->
            <div id="inicio">
                <img scr="#" id="imgInicio" alt="#">
                <a href="Inicio" id="inicio" target="_self">Início</a>
            </div>
       
             <!--menu solicitar senha-->
            <div id="divSolicitacaoDeSenha">
                <img src="#"id="imgSolicitacaoDeSenha" alt="#">
                <a href="#" id="solicitacaoDeSenha" target="_self">Solicitação de Senha</a>
            </div>

             <!--menu acompanhar senha-->
            <div id="div-acompanhar-senha">
                <img src="#"id="imgAcompanharSenha" alt="#">
                <a href="#" id="acompanharSenha" target="_self">Acompanhar Senha</a>
            </div>

             <!--menu notificações-->
            <div id="div-notificacao">
                <img src="#" id="img-imgNotiFicacao" alt="#">
                 <a href="Notificacao" id="notificacao" target="_self">Notifições</a>
             </div>

        </div>  <!--fecho do menu container-->


         <!--escolher idioma-->
          
        <select class="escolherLingua" alt="#">
            <option id="prtugues">Portugues</option>
            <option id="emakwa">Emakwa</option>
            <option id="ximakonde">ximakonde</option>
            <option id="ingles">Ingles</option>

        </select>
  
    </header>
    
    <div class="questionario">
   
        <h2>Insira a sua duvida</h2>
        
        <p><strong>Pergunta frequentes</strong></p>
        
        <select name="" id="comoUsarAPlataforma">
        <option value="">Como usar a plataforma</option>
        </select>
        
        <select name="" id="deficienciaV">
        <option value="">Sou uma pessoa com deficiência visual</option>
        </select>
        
        <select name="" id="deficienciaA">
        <option value="">Sou uma pessoa com deficiência auditiva</option>
        </select>
        
        <select name="" id="cemCell">
        <option value="">Meu vizinho não celular</option>
        </select>
        
        <br>
        <form action="">
            <h3>Feedback</h3>
            
            <p><strong>Dé-nos sua opinião de como está sendo a sua experiência e como podemos melhorar.</strong></p>
            <input type="submit" id="tx" placeholder="Insira aqui, o seu Feedback">

            <br>
            <button id="btn">Enviar</button>
        </form>
    </div>
</body>
</html>
